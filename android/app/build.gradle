apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. Default is "debug", "debugOptimized".
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "liteDebugOptimized", "prodDebug", "prodDebugOptimized"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * Release settings come from a Gradle property (-P or ~/.gradle/gradle.properties) or an
 * environment variable, both named FRUITNINJA_<NAME>. Values are never printed.
 */
def releaseSetting(String name) {
    def key = "FRUITNINJA_${name}"
    def fromProperty = project.findProperty(key)
    def value = fromProperty != null ? fromProperty.toString() : System.getenv(key)
    return (value == null || value.trim().isEmpty()) ? null : value
}

def uploadKeyConfigured = ["UPLOAD_STORE_FILE", "UPLOAD_STORE_PASSWORD", "UPLOAD_KEY_ALIAS", "UPLOAD_KEY_PASSWORD"]
    .every { releaseSetting(it) != null }

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.fruitninja"

    // The MediaPipe model bundle is a zip of tflite models: keep it stored
    // (uncompressed) so it can be memory-mapped instead of inflated into RAM.
    androidResources {
        noCompress += ["task"]
    }
    defaultConfig {
        // Release-time decisions, overridable without editing this file (Gradle property
        // or environment variable): the public application ID must be owner-approved
        // before the first upload and can never change afterwards, and versionCode
        // must increase with every upload. See docs/android/RELEASE_CHECKLIST.md.
        applicationId releaseSetting("APPLICATION_ID") ?: "com.fruitninja"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode((releaseSetting("VERSION_CODE") ?: "1").toInteger())
        versionName releaseSetting("VERSION_NAME") ?: "1.0"
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        // The upload key is supplied privately (environment or ~/.gradle/gradle.properties,
        // never the repository). If it is absent this config stays empty and any release
        // build FAILS (see the guard below): there is no silent fallback to debug signing.
        release {
            if (uploadKeyConfigured) {
                storeFile file(releaseSetting("UPLOAD_STORE_FILE"))
                storePassword releaseSetting("UPLOAD_STORE_PASSWORD")
                keyAlias releaseSetting("UPLOAD_KEY_ALIAS")
                keyPassword releaseSetting("UPLOAD_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

// ---------------------------------------------------------------------------
// Release guards
// ---------------------------------------------------------------------------

// 1. Refuse to build a release artifact without the private upload key. Names only
//    are printed: values (passwords, paths) are never logged.
gradle.taskGraph.whenReady { graph ->
    def buildsRelease = graph.allTasks.any {
        it.project == project && (it.name == "assembleRelease" || it.name == "bundleRelease")
    }
    if (buildsRelease && !uploadKeyConfigured) {
        throw new GradleException(
            "Release signing is not configured, so no release artifact will be built " +
            "(it is deliberately NOT signed with the debug key).\n" +
            "Provide the private upload key through environment variables or " +
            "~/.gradle/gradle.properties (never commit it):\n" +
            "  FRUITNINJA_UPLOAD_STORE_FILE, FRUITNINJA_UPLOAD_STORE_PASSWORD,\n" +
            "  FRUITNINJA_UPLOAD_KEY_ALIAS, FRUITNINJA_UPLOAD_KEY_PASSWORD\n" +
            "See docs/android/RELEASE_CHECKLIST.md.")
    }
}

// 2. The privacy design is "no network access" (MediaPipe's usage logger, which would
//    send diagnostics to Google, cannot run without it). Fail the release build if the
//    MERGED manifest ever requests a network permission, e.g. after adding a dependency.
tasks.register("verifyReleaseHasNoNetworkPermissions") {
    dependsOn "processReleaseMainManifest"
    doLast {
        def forbidden = [
            "android.permission.INTERNET",
            "android.permission.ACCESS_NETWORK_STATE",
            "android.permission.ACCESS_WIFI_STATE",
        ]
        def manifests = fileTree(
            dir: layout.buildDirectory.dir("intermediates/merged_manifest/release"),
            include: "**/AndroidManifest.xml").files
        if (manifests.isEmpty()) {
            throw new GradleException("Merged release manifest not found: cannot verify permissions")
        }
        manifests.each { file ->
            def text = file.text
            def found = forbidden.findAll { text.contains("\"${it}\"") }
            if (!found.isEmpty()) {
                throw new GradleException(
                    "The merged RELEASE manifest requests network permission(s) ${found}. " +
                    "The app promises no network access (see PrivacyScreen and the Data safety " +
                    "draft). Remove the dependency or update the privacy documents deliberately.")
            }
        }
    }
}
afterEvaluate {
    tasks.matching { it.name == "assembleRelease" || it.name == "bundleRelease" }.configureEach {
        dependsOn "verifyReleaseHasNoNetworkPermissions"
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
