import java.security.MessageDigest

def getExtOrDefault(name, fallback) {
    return rootProject.ext.has(name) ? rootProject.ext.get(name) : fallback
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"
apply plugin: "com.facebook.react"

// Pinned in android/build.gradle (ext). The fallbacks are only for building the
// library on its own; never use "latest.release" here.
def cameraXVersion = getExtOrDefault("cameraXVersion", "1.6.2")
def mediaPipeVersion = getExtOrDefault("mediaPipeVersion", "1.0.0")

android {
    namespace "com.fruitninja.hands"
    compileSdk getExtOrDefault("compileSdkVersion", 36)
    ndkVersion getExtOrDefault("ndkVersion", "27.1.12297006")

    defaultConfig {
        minSdk getExtOrDefault("minSdkVersion", 24)
        buildConfigField "String", "CAMERAX_VERSION", "\"${cameraXVersion}\""
        buildConfigField "String", "MEDIAPIPE_VERSION", "\"${mediaPipeVersion}\""
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation "com.facebook.react:react-android"

    // Camera: CameraX is the only camera API used by the app.
    implementation "androidx.camera:camera-core:$cameraXVersion"
    implementation "androidx.camera:camera-camera2:$cameraXVersion"
    implementation "androidx.camera:camera-lifecycle:$cameraXVersion"
    implementation "androidx.camera:camera-view:$cameraXVersion"

    // On-device hand landmark inference (native libs for arm64-v8a, armeabi-v7a, x86, x86_64).
    implementation "com.google.mediapipe:tasks-vision:$mediaPipeVersion"

    testImplementation "junit:junit:4.13.2"
}

react {
    jsRootDir = file("../src/specs/")
    libraryName = "HandsSpec"
    codegenJavaPackageName = "com.fruitninja.hands"
}

// The bundled model must match its recorded SHA-256, otherwise the build fails.
// (ModelIntegrity re-checks the same digest at runtime.)
tasks.register("verifyHandLandmarkerModel") {
    def assetsDir = file("src/main/assets")
    inputs.dir(assetsDir)
    doLast {
        def model = new File(assetsDir, "hand_landmarker.task")
        def sidecar = new File(assetsDir, "hand_landmarker.task.sha256")
        if (!model.exists() || !sidecar.exists()) {
            throw new GradleException("Hand model or its .sha256 file is missing in ${assetsDir}")
        }
        def expected = sidecar.text.trim().split(/\s+/)[0].toLowerCase()
        def digest = MessageDigest.getInstance("SHA-256")
        model.withInputStream { stream ->
            def buffer = new byte[65536]
            int n
            while ((n = stream.read(buffer)) > 0) {
                digest.update(buffer, 0, n)
            }
        }
        def actual = digest.digest().collect { String.format("%02x", it) }.join("")
        if (actual != expected) {
            throw new GradleException(
                "hand_landmarker.task checksum mismatch: expected ${expected}, got ${actual}")
        }
    }
}

tasks.named("preBuild") {
    dependsOn("verifyHandLandmarkerModel")
}
